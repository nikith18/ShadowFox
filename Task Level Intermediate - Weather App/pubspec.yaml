name: Weather App
description: "A comprehensive Weather App with real-time forecasts, Glassmorphism UI, and dark/light themes. Powered by Open-Meteo (no API key required)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Networking (also used for Open-Meteo Geocoding)
  http: ^1.2.2
  # State management
  provider: ^6.1.2
  # Local storage for theme persistence
  shared_preferences: ^2.3.2
  # GPS / Location
  geolocator: ^13.0.2
  # Loading skeleton
  shimmer: ^3.0.0
  # Date formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
