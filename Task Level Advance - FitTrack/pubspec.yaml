name: fittrack_pro
description: "Smart Fitness Tracking App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Local storage
  shared_preferences: ^2.3.2

  # Google Fonts for beautiful typography
  google_fonts: ^6.2.1

  # Chart library for data visualization
  fl_chart: ^0.69.0

  # CSV parsing for dataset mode
  csv: ^6.0.0

  # Date/time formatting
  intl: ^0.19.0

  # Lottie animations
  lottie: ^3.1.2

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
