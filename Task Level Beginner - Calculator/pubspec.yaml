name: my_app
description: "Smart Modern Calculator - A production-quality Flutter calculator with glassmorphism UI, dark/light theme, animations, and clean architecture."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI Icons
  cupertino_icons: ^1.0.8

  # State Management - Provider pattern for clean architecture
  provider: ^6.1.2

  # Persistent Storage - Save theme preference across app restarts
  shared_preferences: ^2.3.2

  # Math Expression Evaluation - Safe parsing of mathematical expressions
  math_expressions: ^2.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Assets configuration for future image/icon support
  # assets:
  #   - assets/images/
  #   - assets/icons/

  # Custom Google Fonts are loaded via HTTP; no local font files needed
  # for this project (uses system fonts + Material icons).
